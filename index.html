<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#2563eb">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>APD Oasis - Warehouse Logistics</title>
    
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
    
    <!-- Axios -->
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    
    <style>
        /* Mobile-optimized styles */
        * {
            -webkit-tap-highlight-color: transparent;
        }
        
        html, body {
            height: 100%;
            width: 100%;
            position: fixed;
            overflow: hidden;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
        }
        
        /* Fix for inconsistent viewport on Android */
        #app {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
        }
        
        /* Prevent zoom on input focus */
        input, select, textarea {
            font-size: 16px !important;
        }
        
        /* Better touch targets */
        button, a {
            min-height: 44px;
            min-width: 44px;
        }
        
        /* Smooth scrolling */
        .scroll-container {
            -webkit-overflow-scrolling: touch;
            overflow-y: auto;
        }
        
        /* Fix for Zebra/Android WebView viewport issues */
        @supports (-webkit-touch-callout: none) {
            body {
                /* iOS specific */
                min-height: -webkit-fill-available;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Development/UAT Environment Indicator -->
    <div id="env-indicator" style="display: none; position: fixed; top: 0; left: 0; right: 0; background: linear-gradient(135deg, #FF9800 0%, #FF5722 100%); color: white; padding: 8px 16px; text-align: center; z-index: 9999; font-weight: bold; box-shadow: 0 2px 8px rgba(0,0,0,0.2);">
        <i class="fas fa-flask"></i> DEVELOPMENT/UAT ENVIRONMENT - Safe Testing Mode
    </div>
    
    <div id="app"></div>
    
    <!-- Environment Detection Script -->
    <script>
        (function() {
            const hostname = window.location.hostname;
            const isDevelopment = hostname.includes('apd-oasis-dev') || 
                                 hostname.includes('localhost') ||
                                 hostname.includes('127.0.0.1') ||
                                 hostname.includes('sandbox') ||
                                 hostname.includes('novita');
            
            if (isDevelopment) {
                document.getElementById('env-indicator').style.display = 'block';
                document.getElementById('app').style.paddingTop = '44px'; // Add padding for banner
                console.log('%c🧪 DEVELOPMENT/UAT MODE', 'background: #FF9800; color: white; font-size: 16px; font-weight: bold; padding: 8px 16px;');
                console.log('%c✅ Safe Testing Environment - Production database NOT affected', 'color: #4CAF50; font-size: 12px; font-weight: bold;');
            } else {
                console.log('%c🚀 PRODUCTION MODE', 'background: #4CAF50; color: white; font-size: 16px; font-weight: bold; padding: 8px 16px;');
            }
        })();
    </script>
    
    <!-- Load application script -->
    <script src="/static/app.js"></script>
    
    <!-- Load inter-branch transfer module -->
    <script src="/static/inter-transfer.js"></script>
</body>
</html>
